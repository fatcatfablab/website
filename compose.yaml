services:
  web:
    build:
      context: .
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    env_file:
      - path: .env.deployment
        required: true
        format: raw
    environment:
      HOST: 0.0.0.0
      PORT: "4321"
      NODE_ENV: production
      FCFL_PRIVATE_CONTENT_PATH: /app/private-content/protected-pages.json
    user: "10001:10001"
    read_only: true
    ports:
      - "127.0.0.1:4321:4321"
    volumes:
      - type: bind
        source: ./private-content
        target: /app/private-content
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const port=process.env.PORT||'4321';fetch('http://127.0.0.1:'+port+'/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
